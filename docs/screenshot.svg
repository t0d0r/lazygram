<text y="206" xml:space="preserve"><tspan x="12.0" fill="#4c5669">13:22</tspan><tspan x="54.0" fill="#d8dee9"> </tspan><tspan x="62.4" fill="#ebcb8b" font-weight="bold">@demobot</tspan><tspan x="129.6" fill="#d8dee9"> </tspan><tspan x="138.0" fill="#81a1c1">&lt;demobot&gt;</tspan><tspan x="213.6" fill="#d8dee9"> Release candidate is green. Deploy it now? Use /press 1 or /press 2.</tspan></text>
<text y="224" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      </tspan><tspan x="62.4" fill="#d08770">[1] Deploy  [2] Hold  [3] Runbook (link)  (msg 25)</tspan></text>
<text y="242" xml:space="preserve"><tspan x="12.0" fill="#4c5669">13:23</tspan><tspan x="54.0" fill="#d8dee9"> </tspan><tspan x="62.4" fill="#81a1c1" font-weight="bold">#news</tspan><tspan x="104.4" fill="#d8dee9">    </tspan><tspan x="138.0" fill="#88c0d0">&lt;wire&gt;</tspan><tspan x="188.4" fill="#d8dee9"> Demo digest: three stories today.</tspan></text>
<text y="260" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      1. Terminal clients keep their users.</tspan></text>
<text y="278" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      2. Encrypted local caches become the norm.</tspan></text>
<text y="296" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      3. Nobody misses the gap under the nick.</tspan></text>
<text y="314" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      That is all for this hour, back at the top of the next one with more invented news for the</tspan></text>
<text y="332" xml:space="preserve"><tspan x="12.0" fill="#d8dee9">      demo feed.</tspan></text>
